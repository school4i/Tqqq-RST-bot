name: TQQQ RST Bot Execution

on:
  schedule:
    # 🌟 [중요 수정] GitHub Actions의 크론(cron)은 항상 영국 시간(UTC) 기준입니다.
    # 기존 '23 9 * * 1-5'는 한국 시간(KST)으로 저녁 6시 23분에 실행되는 설정이었습니다.
    # 한국 시간 밤 9시 23분에 정상 실행되도록 UTC 시간인 낮 12시 23분('23 12 * * 1-5')으로 수정했습니다.
    - cron: '23 12 * * 1-5'
  workflow_dispatch: # 🛠️ 언제든 원할 때 수동으로 실행할 수 있는 버튼을 활성화합니다.

# ✅ [수정 반영] 봇이 가계부(state.json)를 저장소에 다시 기록할 수 있도록 쓰기 권한을 부여합니다.
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬(Python) 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      # ✅ [수정 반영] V3.1 파이썬 코드에서 사용하는 'numpy'가 누락되어 있어 추가 설치하도록 수정했습니다.
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests pandas numpy scipy

    - name: RST 프로그램 실행
      # 🔒 금고(Secrets)에서 값을 꺼내 파이썬 프로그램에 안전하게 주입합니다.
      # state.json이 생성되기 전 최초 가동 시 패스워드 역할을 해줍니다.
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        MY_SHARES: ${{ secrets.MY_SHARES }}
        MY_CASH: ${{ secrets.MY_CASH }}
        MY_AVG_PRICE: ${{ secrets.MY_AVG_PRICE }}
        BASE_AMOUNT: ${{ secrets.BASE_AMOUNT }}
        TAX_FREE_EXHAUSTED: ${{ secrets.TAX_FREE_EXHAUSTED }}
        INITIAL_CASH: ${{ secrets.INITIAL_CASH }}
      run: python Rst_bot.py

    # ✅ [수정 반영] 프로그램 실행 후 변경된 state.json과 signals.csv를 깃허브에 영구 저장 (휘발 방지)
    - name: 가계부(state.json) 및 로그 자동 커밋/푸시
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add state.json signals.csv
        # 변경 사항이 존재할 때만 커밋하고 푸시하여 에러를 방지합니다.
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 봇에 의한 가계부(state.json) 자동 업데이트" && git push)
